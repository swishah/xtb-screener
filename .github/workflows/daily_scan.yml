name: Daily market scan

on:
  schedule:
    # 22:30 UTC, pon-pt (po zamknięciu rynków US) — dostosuj wg potrzeby
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/run_daily_scan.py

      - name: Commit updated snapshot DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.db
          git diff --staged --quiet || git commit -m "Daily scan $(date -u +%Y-%m-%d)"
          # Ktoś mógł w międzyczasie wypchnąć commit na main (np. ręczny upload
          # pliku przez przeglądarkę) — dociągamy najnowszy main i doklejamy
          # nasz commit na wierzch, zamiast pozwolić pushowi się wywalić.
          git pull --rebase origin main
          git push
