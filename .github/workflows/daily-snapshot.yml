# .github/workflows/daily-snapshot.yml
#
# Uruchamia screener raz dziennie po zamknięciu sesji europejskich i zapisuje
# snapshot z powrotem do repozytorium. Claude czyta te pliki przez konektor GitHub.
#
# Wymaga: Settings > Actions > General > Workflow permissions = "Read and write"

name: Daily snapshot

on:
  schedule:
    # 06:10 UTC w dni robocze — po zamknięciu sesji US z poprzedniego dnia.
    # UWAGA: harmonogram GitHub Actions bywa opóźniony o kilkanaście minut przy
    # dużym obciążeniu. Nie zakładaj punktualności co do minuty.
    - cron: "10 6 * * 1-5"
  workflow_dispatch:        # pozwala odpalić ręcznie z zakładki Actions

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build snapshot
        run: python scripts/build_snapshot.py --out data/snapshots

      - name: Prune old snapshots
        # Trzyma ~400 plików dziennych. Bez tego repo puchnie w nieskończoność.
        run: |
          cd data/snapshots
          ls -1 [0-9]*.json | sort | head -n -400 | xargs -r rm --
          cd - > /dev/null

      - name: Commit results
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@github.com"
          git add data/snapshots
          if git diff --staged --quiet; then
            echo "Brak zmian — nic do commitowania."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify Discord on failure
        # Bez tego cichy failure oznacza, że przez tydzień czytasz stare dane
        # i nie wiesz o tym. Ustaw DISCORD_WEBHOOK w Settings > Secrets > Actions.
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content":"Snapshot failed: '"$GITHUB_REPOSITORY"' run '"$GITHUB_RUN_ID"'"}' \
               "$WEBHOOK"
