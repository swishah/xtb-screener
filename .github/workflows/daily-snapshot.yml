# .github/workflows/daily-snapshot.yml
#
# Wymaga: Settings > Actions > General > Workflow permissions = "Read and write"
# Przy nieudanym przebiegu GitHub wysyla maila na adres konta -- osobne
# powiadomienie nie jest potrzebne.

name: Daily snapshot

on:
  schedule:
    # 06:10 UTC w dni robocze. Harmonogram GitHuba bywa opozniony
    # o kilkanascie minut przy duzym obciazeniu.
    - cron: "10 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build snapshot
        # Rotacja starych plikow jest w skrypcie (--keep-days), wiec nie ma
        # juz osobnego kroku "Prune old snapshots".
        run: python scripts/build_snapshot.py --out data/snapshots

      - name: Commit results
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@github.com"
          git add data/snapshots
          if git diff --staged --quiet; then
            echo "Brak zmian - nic do commitowania."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
