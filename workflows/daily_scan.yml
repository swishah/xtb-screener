name: Daily market scan

on:
  schedule:
    # 22:30 UTC, pon-pt (po zamknięciu rynków US) — dostosuj wg potrzeby
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scripts/run_daily_scan.py

      - name: Commit updated snapshot DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.db
          git diff --staged --quiet || git commit -m "Daily scan $(date -u +%Y-%m-%d)"
          git push
